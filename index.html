function renderCert(root){
  launchConfetti(60);sfxCheer();
  const st=APP_STATE.postRecord.stickers.join(' ');
  root.innerHTML=`
    <div class="cert-wrap">
      <div class="cert-card">
        <h1>🌟 모으기와 가르기 수료증 🌟</h1>
        <div style="text-align:center"><div class="cert-name">${APP_STATE.learnerClass?APP_STATE.learnerClass+' ':''}${APP_STATE.learnerName}</div></div>
        <div class="cert-compare">
          <div class="cert-box pre">
            <h3>💡 활동 전 — 내가 아는 모으기·가르기</h3>
            <p>${APP_STATE.preRecord.text||'(녹음하지 않았어요)'}</p>
          </div>
          <div class="cert-box post">
            <h3>🌟 활동 후 — 새롭게 알게 된 점</h3>
            <p>${APP_STATE.postRecord.text||'(녹음하지 않았어요)'}</p>
          </div>
        </div>
        <div class="dashboard">
          <div class="dash-card"><div class="num">${APP_STATE.correct}/${APP_STATE.total}</div><div class="label">📚 정답 / 도전</div></div>
          <div class="dash-card"><div class="num">${'★'.repeat(APP_STATE.postRecord.stars)}${'☆'.repeat(5-APP_STATE.postRecord.stars)}</div><div class="label">⭐ 자기평가</div></div>
          <div class="dash-card"><div class="num">${st||'—'}</div><div class="label">🎁 스티커</div></div>
          <div class="dash-card"><div class="num">${APP_STATE.maxCombo||0}</div><div class="label">🔥 최고 연속 정답</div></div>
        </div>
        <div class="cert-collection">
          <h3 style="text-align:center;font-family:var(--font-display);font-size:22px;color:#444;margin:14px 0 10px">🎨 오늘의 도감</h3>
          <div class="collection-grid">${renderCollection()}</div>
        </div>
        <div style="text-align:center;font-family:var(--font-display);font-size:22px;color:#666;margin-top:14px">${getFinalMessage()}</div>
      </div>
      <div class="cert-buttons">
        <button class="big-btn" onclick="downloadCert()">📥 수료증 저장</button>
        <button class="big-btn green" onclick="goHome()">🔄 처음부터 다시</button>
      </div>
      <div class="mascot-corner"><div class="mascot-with-cap">${svgMoEum(130)}<svg class="grad-cap-svg" viewBox="-40 -22 80 30"><polygon points="-32,-2 32,-2 28,-10 -28,-10" fill="#2A2A4A" stroke="#1A1A30" stroke-width="1"/><rect x="-34" y="-2" width="68" height="5" fill="#2A2A4A" rx="1"/><line x1="18" y1="-4" x2="34" y2="-18" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/><circle cx="34" cy="-18" r="5" fill="#FFD700" stroke="#D4A800" stroke-width="1.5"/></svg></div></div>
      <div class="mascot-corner right"><div class="mascot-with-cap">${svgNaNum(130)}<svg class="ribbon-svg" viewBox="-30 -8 60 16"><path d="M -22 0 Q -10 -7 0 0 Q 10 -7 22 0 Q 10 7 0 0 Q -10 7 -22 0 Z" fill="#FF6FA8" stroke="#C73874" stroke-width="1.5"/><circle cx="0" cy="0" r="3" fill="#FFD700"/></svg></div></div>
      <div class="speech">정말 잘했어! 🎉</div>
    </div>`;
  speak('모으기와 가르기 수료증을 받았어요. 정말 잘했어요!',{mode:'protect'});
}
function renderCollection(){
  // 이 앱에서 사용된 카테고리 추출
  const usedCats=[...new Set(APP_STATE.questions.map(q=>STAGE_CATEGORY[q.stage]).filter(Boolean))];
  const collected=new Set(APP_STATE.collected||[]);
  return usedCats.map(cat=>{
    const info=CATEGORY_INFO[cat];
    const done=collected.has(cat);
    return `<div class="coll-item ${done?'on':''}" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;background:${done?'linear-gradient(180deg,#FFE066,#FFC23C)':'#F0F0F0'};border:3px solid ${done?'#E8B100':'#D0D0D0'};opacity:${done?'1':'.4'};transition:all .3s">
      <div style="font-size:34px;filter:${done?'none':'grayscale(1)'}">${info.icon}</div>
      <div style="font-family:var(--font-display);font-size:13px;color:${done?'#5A3A00':'#999'};font-weight:bold">${info.label}</div>
    </div>`;
  }).join('');
}
function getFinalMessage(){
  const c=APP_STATE.correct,t=APP_STATE.total;
  if(t===0)return '💛 도전한 용기가 멋져요. 다음에 또 함께해요';
  if(c>=t*0.8)return '👑 환상적이에요! 모으기·가르기를 잘 이해했어요';
  if(c>=t*0.5)return '🌈 잘 자라고 있어요! 더 도전해 봐요';
  return '💛 도전한 용기가 멋졌어요. 한 번 더 같이 해 봐요';
}
async function downloadCert(){
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const W=1200,H=1600;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FFFEF0');g.addColorStop(1,'#FFF6D6');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#FFC23C';ctx.lineWidth=18;ctx.strokeRect(36,36,W-72,H-72);
  ctx.strokeStyle='#FFE08A';ctx.lineWidth=4;ctx.strokeRect(62,62,W-124,H-124);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const F=(size,fam)=>`bold ${size}px ${fam==='d'?'Jua':'"Nanum Gothic"'}, sans-serif`;
  // 줄 바꿔 쓰기
  function wrap(text,x,y,maxW,lineH,maxLines){
    const chars=[...String(text||'')];let line='',lines=[];
    chars.forEach(ch=>{ if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch;} else line+=ch; });
    if(line)lines.push(line);
    if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…';}
    lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
    return lines.length;
  }
  function box(x,y,w,h,fill,stroke){
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,22);else ctx.rect(x,y,w,h);
    ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=stroke;ctx.stroke();
  }
  ctx.fillStyle='#6B4A00';ctx.font=F(68,'d');
  ctx.fillText('🌟 모으기와 가르기 수료증 🌟',W/2,180);
  ctx.fillStyle='#2F7A12';ctx.font=F(56,'d');
  const who=(APP_STATE.learnerClass?APP_STATE.learnerClass+' ':'')+(APP_STATE.learnerName||'');
  ctx.fillText(who,W/2,290);
  ctx.fillStyle='#333';ctx.font=F(30,'b');
  ctx.fillText('모음이와 나눔이의 모험을 끝까지 해냈어요!',W/2,360);
  // 활동 전·후 생각
  const pre=APP_STATE.preRecord.text||'(녹음하지 않았어요)';
  const post=APP_STATE.postRecord.text||'(녹음하지 않았어요)';
  box(110,420,W-220,230,'#FFF8E6','#FFC23C');
  ctx.fillStyle='#8A6200';ctx.font=F(28,'d');ctx.fillText('💡 활동 전, 내가 아는 모으기와 가르기',W/2,475);
  ctx.fillStyle='#333';ctx.font=F(28,'b');wrap(pre,W/2,530,W-300,42,3);
  box(110,690,W-220,230,'#EEF8E8','#5BB836');
  ctx.fillStyle='#2F7A12';ctx.font=F(28,'d');ctx.fillText('🌟 활동 후, 새롭게 알게 된 점',W/2,745);
  ctx.fillStyle='#333';ctx.font=F(28,'b');wrap(post,W/2,800,W-300,42,3);
  // 숫자 카드
  const cards=[
    [`${APP_STATE.correct}/${APP_STATE.total}`,'📚 정답 / 도전'],
    ['★'.repeat(APP_STATE.postRecord.stars||0)+'☆'.repeat(5-(APP_STATE.postRecord.stars||0)),'⭐ 자기평가'],
    [(APP_STATE.postRecord.stickers||[]).join('')||'—','🎁 스티커'],
    [String(APP_STATE.maxCombo||0),'🔥 최고 연속 정답']
  ];
  const cw=230,gap=20,startX=(W-(cw*4+gap*3))/2;
  cards.forEach((c,i)=>{
    const x=startX+i*(cw+gap);box(x,960,cw,150,'#FFFFFF','#E5E7EB');
    ctx.fillStyle='#222';ctx.font=F(c[0].length>8?26:40,'d');ctx.fillText(c[0],x+cw/2,1035);
    ctx.fillStyle='#666';ctx.font=F(20,'b');ctx.fillText(c[1],x+cw/2,1085);
  });
  // 오늘의 도감
  ctx.fillStyle='#444';ctx.font=F(34,'d');ctx.fillText('🎨 오늘의 도감',W/2,1180);
  const usedCats=[...new Set(APP_STATE.questions.map(q=>STAGE_CATEGORY[q.stage]).filter(Boolean))];
  const got=new Set(APP_STATE.collected||[]);
  const per=Math.min(usedCats.length,6),iw=150,ig=16;
  usedCats.forEach((cat,i)=>{
    const row=Math.floor(i/per),col=i%per;
    const inRow=Math.min(per,usedCats.length-row*per);
    const x=(W-(iw*inRow+ig*(inRow-1)))/2+col*(iw+ig),y=1210+row*130;
    const on=got.has(cat),info=CATEGORY_INFO[cat]||{icon:'❔',label:cat};
    box(x,y,iw,115,on?'#FFE066':'#F0F0F0',on?'#E8B100':'#D0D0D0');
    ctx.globalAlpha=on?1:.4;
    ctx.font='44px sans-serif';ctx.fillStyle='#222';ctx.fillText(info.icon,x+iw/2,y+58);
    ctx.font=F(20,'b');ctx.fillText(info.label,x+iw/2,y+96);
    ctx.globalAlpha=1;
  });
  ctx.fillStyle='#888';ctx.font=F(24,'b');
  ctx.fillText(new Date().toLocaleDateString('ko-KR'),W/2,H-100);
  const link=document.createElement('a');
  link.download=`모으기와_가르기_수료증_${APP_STATE.learnerName||'학생'}.png`;
  link.href=canvas.toDataURL('image/png');
  document.body.appendChild(link);link.click();link.remove();
}
</script>
</body>
</html>
